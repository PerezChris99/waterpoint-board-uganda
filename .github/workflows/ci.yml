name: CI

on:
  pull_request:
    branches: [perez, main]
  push:
    branches: [perez, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waterpoint
          POSTGRES_PASSWORD: waterpoint
          POSTGRES_DB: waterpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://waterpoint:waterpoint@localhost:5432/waterpoint_test
      JWT_SECRET: ci-only-secret-not-used-in-production-32chars
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: ci-admin@waterpointboard.example
      SEED_ADMIN_PASSWORD: ci-only-seed-password-not-real-32chars
      RATE_LIMIT_FAIL_CLOSED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit
        run: npm audit --audit-level=high --json > audit.json
        continue-on-error: true

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/audit.json
          retention-days: 14
