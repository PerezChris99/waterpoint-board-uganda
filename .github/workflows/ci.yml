name: CI

on:
  pull_request:
    branches: [perez, main]
  push:
    branches: [perez, main]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waterpoint
          POSTGRES_PASSWORD: waterpoint
          POSTGRES_DB: waterpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://waterpoint:waterpoint@localhost:5432/waterpoint_test
      JWT_SECRET: ci-only-secret-not-used-in-production-32chars
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Push Prisma schema to test database
        run: npx prisma db push

      - name: Seed test database
        run: npm run db:seed

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
