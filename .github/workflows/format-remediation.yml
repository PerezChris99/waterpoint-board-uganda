name: Format remediation

on:
  push:
    branches:
      - chore/national-hardening-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format changed source files
        run: |
          files=$(git diff --name-only origin/perez...HEAD -- 'frontend/*.ts' 'frontend/*.tsx' 'frontend/*.js' 'frontend/*.jsx' 'frontend/*.json' 'frontend/*.css' 'frontend/*.md' 'frontend/src/**' 'frontend/prisma/**' | sed 's#^frontend/##' | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx prettier --write
          fi
      - name: Commit formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format hardening changes"
          git push
