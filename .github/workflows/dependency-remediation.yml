name: Dependency remediation

on:
  push:
    branches:
      - chore/national-hardening-foundation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade directly affected packages
        run: npm install maplibre-gl@6.12.0 next@16.3.6
      - name: Apply safe transitive security fixes
        run: npm audit fix --package-lock-only
      - name: Verify high and critical vulnerabilities are gone
        run: npm audit --audit-level=high
      - name: Commit dependency remediation
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "security(deps): remediate known dependency vulnerabilities"
          git push
