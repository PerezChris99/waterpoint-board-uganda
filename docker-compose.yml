services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterpoint
      POSTGRES_PASSWORD: waterpoint
      POSTGRES_DB: waterpoint
    ports:
      - "5432:5432"
    volumes:
      - waterpoint_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      DATABASE_URL: postgresql://waterpoint:waterpoint@postgres:5432/waterpoint
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  waterpoint_postgres_data:
